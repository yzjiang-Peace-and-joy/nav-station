server {
    # Prefer HTTP/1.1 on this host: intermittent ERR_CONNECTION_CLOSED in Edge/Chrome
    # often correlates with HTTP/2 on flaky client↔server paths; refresh then works.
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nav.5ai.icu;

    # ssl_certificate and ssl_certificate_key are managed by the server's TLS setup.

    root /apps/nav_station/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:9966;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
