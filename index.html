<!DOCTYPE html>
<html lang="zh-CN" data-theme-pack="sunset-coral" data-color-scheme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="个人导航站 — 精选开发工具、AI 与效率资源" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>个人导航站</title>
    <script>
      ;(function () {
        var pack = 'sunset-coral'
        var scheme = 'system'
        try {
          var storedPack = localStorage.getItem('nav.themePack')
          if (storedPack === 'sunset-coral') pack = storedPack
          var storedScheme = localStorage.getItem('nav.colorScheme')
          if (storedScheme === 'light' || storedScheme === 'dark' || storedScheme === 'system') {
            scheme = storedScheme
          } else {
            var legacy = localStorage.getItem('nav_theme')
            if (legacy === 'light' || legacy === 'dark') scheme = legacy
          }
        } catch (e) {}
        var resolved = scheme
        if (resolved !== 'light' && resolved !== 'dark') {
          resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        var root = document.documentElement
        root.setAttribute('data-theme-pack', pack)
        root.setAttribute('data-color-scheme', resolved)
        root.removeAttribute('data-theme')
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
